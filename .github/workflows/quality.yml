name: Quality

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Isolated fixtures: CI never reads or edits the production dataset.
      SANITY_TEST_MODE: "true"
      NEXT_PUBLIC_SITE_ENV: staging
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3123
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_SANITY_DATASET: ci-placeholder
      NEXT_PUBLIC_SANITY_API_VERSION: 2026-09-04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
